name: Auto PR from feature/* to main (PHP checks)

on:
  push:
    branches:
      - "feature/**"

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: auto-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-checks-and-open-pr:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Validação simples: checar sintaxe PHP em arquivos do repo
      - name: PHP Syntax Check
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli
          # checa sintaxe de todos os .php (ignora vendor se existir)
          find . -type f -name "*.php" -not -path "./vendor/*" -print0 \
            | xargs -0 -n 1 -I {} php -l "{}"

      # Cria PR automaticamente (exige PAT no secret PR_TOKEN)
      - name: Create PR to main (if not exists)
        env:
          GH_TOKEN: ${{ secrets.PR_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          PR_NUMBER=$(gh pr list --head "$BRANCH" --base "main" --state "open" --json number --jq '.[0].number' || true)

          if [ -n "$PR_NUMBER" ]; then
            echo "PR já existe: #$PR_NUMBER"
            exit 0
          fi

          gh pr create \
            --base "main" \
            --head "$BRANCH" \
            --title "Merge $BRANCH -> main" \
            --body "PR criado automaticamente após validação de sintaxe PHP OK no push da branch **$BRANCH**."
